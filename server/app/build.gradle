import java.nio.file.Files
import java.nio.file.Paths

plugins {
    id 'java'
    alias(gradlePluginLibs.plugins.spring.boot)
    alias(gradlePluginLibs.plugins.test.logger)
    alias(gradlePluginLibs.plugins.rewrite)
}

ext {
    serviceName = rootProject.serverName
    imageLabels = ["name"       : "${calculateShortTag(rootProject.serverName)}".toString(),
                   "vendor"     : "mgm technology partners GmbH",
                   "version"    : project.version,
                   "release"    : rootProject.a12ReleaseLine,
                   "summary"    : "A Data Services extensible server application that provides all functionalities to facilitate A12 Application",
                   "description": "A Data Services server with API and implementations to deal with models and documents supporting creation, retrieval, update, deletion and querying"]
}

configurations {
    runTypedAccessorGeneratorConfig
    runMappingCodeGeneratorConfig
}

def isWindows = System.properties['os.name'].toLowerCase().contains('windows')
def generatedTypingsOutputDir = layout.buildDirectory.dir("generatedTypings").get().asFile
def wcfOutputDir = rootProject.layout.buildDirectory.dir('wcf-output/data/models').get().asFile
def convertedFiles = { -> fileTree(dir: wcfOutputDir).files }
// Mapping
def genMappingOutputDir = layout.buildDirectory.dir('tmp/generated/mapping').get().asFile
def mappingOutputDir = layout.buildDirectory.dir('generated/mapping').get().asFile
def mappingBuildDir = layout.buildDirectory.dir('generated/mapping/build').get().asFile
def mappingClassesOutputDir = Paths.get(mappingBuildDir.toString(), 'classes/java/main').toFile()
def mappingResourcesOutputDir = Paths.get(mappingBuildDir.toString(), 'resources/main').toFile()

sourceSets {
    generatedTypings {
        java {
            srcDir(generatedTypingsOutputDir)
        }
    }
    main {
        java {
            compileClasspath += sourceSets.generatedTypings.output
            runtimeClasspath += sourceSets.generatedTypings.output
        }
        resources {
            srcDirs += mappingClassesOutputDir
            srcDirs += mappingResourcesOutputDir
        }
    }
}

dependencies {
    // Spring
    annotationProcessor libs.spring.boot.configuration.processor
    developmentOnly(libs.spring.boot.devtools)

    // A12 Dataservices
    implementation a12Libs.dataservices.server.app
    // dev/SME only — excluded from the production build
    developmentOnly(a12Libs.dataservices.sme.workspace.support)
    implementation a12Libs.rmc.conversion

    // A12 UAA
    implementation a12Libs.uaa.authorization.a12.extension
    implementation a12Libs.uaa.authorization.introspector

    // Native BOMs
    implementation(platform(a12Libs.base.bom))
    implementation(platform(a12Libs.kernel.bom))
    implementation(platform(a12Libs.uaa.bom))
    implementation(platform(a12Libs.dataservices.bom))

    // for logback.xml configurations
	//implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation(libs.logstash)
    implementation(libs.logback.classic)

    def kernelMdFacade = [group: 'com.mgmtp.a12.kernel', name: 'kernel-md-facade', version: a12Libs.versions.kernel.get()]
    runTypedAccessorGeneratorConfig kernelMdFacade + [classifier: 'typed-accessor-gen-cli']
    generatedTypingsImplementation a12Libs.kernel.md.document.v2
    implementation a12Libs.kernel.md.facade

    runMappingCodeGeneratorConfig kernelMdFacade + [classifier: 'MappingCodeGenerator-CLI']
    runMappingCodeGeneratorConfig a12Libs.kernel.md.facade

    // Lombok
    implementation libs.lombok
    annotationProcessor libs.lombok
}

tasks.register('setup') {
    mustRunAfter 'clean'

    doFirst {
        delete mappingOutputDir
        Files.createDirectories(mappingOutputDir.toPath())
        // Ensure the nested Gradle project has its own settings.gradle so that
        // Gradle does not walk up and pick up the root project's settings.gradle.
        new File(mappingOutputDir, 'settings.gradle').text = ''
    }
}

tasks.register('prepareMappingCodeGeneration') {
    dependsOn 'setup'

    doFirst {
        delete genMappingOutputDir
    }
}

tasks.register('generateMappingCode') {
    dependsOn ':convertModels'
    dependsOn 'prepareMappingCodeGeneration'

    def mappingPackagePrefix = 'com.mgmtp.a12.mapping.'

    inputs.dir(wcfOutputDir)
    outputs.dir(genMappingOutputDir)

    doLast {
        def mappingModels = convertedFiles().findAll { isMappingModel(it) }

        if (mappingModels.isEmpty()) {
            throw new GradleException("No converted mapping models found in ${wcfOutputDir}")
        }

        mappingModels.each { model ->
            String modelId = modelId(model)
            providers.javaexec {
                    classpath = configurations.runMappingCodeGeneratorConfig
                    mainClass = 'com.mgmtp.a12.kernel.mapping.cli.MappingModelCodegenCLI'
                    args '--models-dir', wcfOutputDir,
                        '--mapping-model-id', modelId,
                        '--package-prefix', mappingPackagePrefix + modelId,
                        '--output-dir', genMappingOutputDir
            }.result.get()
        }
    }
}

tasks.register('extractMappingCode', Copy) {
    dependsOn 'generateMappingCode'

    from { fileTree(dir: genMappingOutputDir).collect { zipTree(it) } }

    into(mappingOutputDir)
}

tasks.register('compileMappingCode', Exec) {
    dependsOn 'extractMappingCode'

    inputs.files(tasks.named('extractMappingCode'))
    outputs.dir(mappingBuildDir)

    environment System.getenv()
    workingDir mappingOutputDir
    if (isWindows) {
        commandLine 'cmd.exe', '/d', '/c', 'gradle', 'build'
    } else {
        commandLine 'gradle', 'build'
    }
}

tasks.register('runTypedAccessorGenerator', JavaExec) {
    dependsOn ':convertModels'
    classpath = configurations.runTypedAccessorGeneratorConfig
    mainClass = 'com.mgmtp.a12.kernel.md.document.typed_accessor_gen.TypedAccessorGenerator'

    def packagePrefix = 'com.mgmtp.a12.template.server.typings'

    doFirst {
        def documentModels = convertedFiles().findAll { isDocumentModel(it) }

        if (documentModels.isEmpty()) {
            throw new GradleException("No converted document models found in ${wcfOutputDir}")
        }
        def argsList = []
        argsList += ['--document-model-file', documentModels.first().absolutePath]
        argsList += ['--package-prefix', packagePrefix]
        argsList += ['--output-dir', generatedTypingsOutputDir]
        documentModels.each { File jsonFile ->
            argsList += ['-i', jsonFile.absolutePath]
        }
        args argsList
    }
}

tasks.named('compileGeneratedTypingsJava').configure { dependsOn(runTypedAccessorGenerator) }

processResources {
    dependsOn ':convertModels'
    dependsOn 'compileMappingCode'
}

springBoot {
    mainClass = 'com.mgmtp.a12.template.server.ProjectTemplateServerApplication'
    buildInfo {
        properties {
            version = project.version
        }
    }
}

artifacts artifactsVar

publishing publishingVar

rewrite rewriteVar

boolean isDocumentModel(File modelFile) {
    return modelType(modelFile) == 'document'
}

boolean isMappingModel(File modelFile) {
    return modelType(modelFile) == 'mapping'
}

private String modelType(File modelFile) {
    if (!modelFile.name.endsWith('.json')) {
        return null
    }
    try {
        return new groovy.json.JsonSlurper().parse(modelFile)?.header?.modelType
    } catch (Exception e) {
        throw new GradleException("Could not read converted model ${modelFile}", e)
    }
}

private String modelId(File modelFile) {
    if (!modelFile.name.endsWith('.json')) {
        return null
    }
    try {
        return new groovy.json.JsonSlurper().parse(modelFile)?.header?.id
    } catch (Exception e) {
        throw new GradleException("Could not read converted model ${modelFile}", e)
    }
}
